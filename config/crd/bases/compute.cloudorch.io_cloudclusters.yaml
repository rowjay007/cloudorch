apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cloudclusters.compute.cloudorch.io
spec:
  group: compute.cloudorch.io
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - provider
                - region
                - kubernetesVersion
                - nodeCount
                - instanceType
                - clusterName
              properties:
                provider:
                  type: string
                  minLength: 3
                  maxLength: 40
                region:
                  type: string
                  minLength: 2
                  maxLength: 20
                kubernetesVersion:
                  type: string
                  enum: ["1.28", "1.29", "1.30", "1.31"]
                nodeCount:
                  type: integer
                  minimum: 1
                  maximum: 100
                instanceType:
                  type: string
                  enum: ["t3.medium", "t3.large", "t3.xlarge", "m5.large", "m5.xlarge", "m5.2xlarge"]
                spotEnabled:
                  type: boolean
                  default: false
                tags:
                  type: object
                  additionalProperties:
                    type: string
                clusterName:
                  type: string
                  minLength: 5
                  maxLength: 23
                  pattern: "^[a-z][a-z0-9-]*[a-z0-9]$"
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                clusterId:
                  type: string
                endpoint:
                  type: string
                ready:
                  type: boolean
                synced:
                  type: boolean
                estimatedMonthlyCost:
                  type: number
  scope: Namespaced
  names:
    plural: cloudclusters
    singular: cloudcluster
    kind: CloudCluster
    shortNames:
      - cc